<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIU · 数据库表格设计</title><style>
:root{color-scheme:dark;--bg:#151617;--panel:#1c1d1f;--sidebar:#202123;--line:#303236;--muted:#93969c;--text:#e7e8ea;--hover:#292b2e;--accent:#83bfa0;--green:#234536;--greenText:#9bd6b3;--radius:7px;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#101112;color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh;padding:12px;gap:0}.sidebar{width:220px;flex-shrink:0;background:var(--sidebar);border:1px solid #353638;border-radius:12px 0 0 12px;padding:15px 10px}.brand{font-weight:650;font-size:14px;margin:2px 10px 22px}.nav-label{font-size:11px;color:#777b80;padding:18px 10px 8px}.nav{padding:9px 12px;font-size:13px;color:#b5b7bb;border-radius:6px;margin:2px 0}.nav.active{background:#303235;color:#f3f4f5}.nav:hover{background:#2c2e30}.main{min-width:0;flex:1;background:var(--bg);border:1px solid #353638;border-left:0;border-radius:0 12px 12px 0;padding:18px 28px 48px}.crumb{font-size:12px;color:#a3a6ab}.hero{margin:70px 0 24px}.docicon{font-size:48px;line-height:1;margin-bottom:18px;color:#b8babd}.hero h1{font-size:30px;margin:0;font-weight:720;letter-spacing:-.7px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 10px}.view{font-size:12px;background:#292b2e;border:1px solid #383a3d;color:#ddd;padding:7px 10px;border-radius:6px}.tools{display:flex;gap:8px;align-items:center}.iconbtn{border:0;color:#aeb0b4;background:transparent;border-radius:6px;padding:7px 9px}.iconbtn:hover{background:var(--hover)}.primary{border:0;background:#367cb6;color:white;border-radius:6px;padding:7px 12px;font-size:12px}.tablewrap{overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}table{width:100%;min-width:1100px;border-collapse:separate;border-spacing:0;table-layout:fixed;text-align:left}th,td{border-right:1px solid #2b2d30;border-bottom:1px solid #292b2e;height:36px;padding:0 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th:last-child,td:last-child{border-right:0}thead th{font-weight:500;color:#a9adb2;background:#1b1c1e}thead tr.groups th{height:30px;font-size:11px;letter-spacing:.3px;background:#1a1b1d;color:#85898e}thead tr.groups th.reqgroup{background:#20372c;color:#a5d8b6;border-bottom:1px solid #416a51}.group-toggle{border:0;background:none;color:inherit;font-size:11px;padding:0}.group-toggle:hover{color:white}thead tr.fields th{height:38px}thead tr.fields th.req{background:#1d2721;color:#c1d7c8}thead tr.fields th.req:first-of-type{border-left:2px solid #568e6b}.fieldicon{color:#81868b;margin-right:7px}.req .fieldicon{color:#80aa8c}tbody tr:hover td{background:#202225}.titlecell{font-size:12px;color:#e0e1e3}.file{color:#a6a8ab;margin-right:7px}.muted{color:#777d82}.count{color:#92969c;font-size:11px;margin-left:8px}.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;font-size:11px;line-height:16px;background:#2a2c2e;color:#c0c2c5}.pill.green{background:#244332;color:#a5d9b4}.pill.orange{background:#5b3926;color:#f5b486}.pill.blue{background:#233e52;color:#9ecde8}.pill.purple{background:#4b2945;color:#dca4d4}.plainstate{display:inline-flex;align-items:center;gap:7px;color:#b6b8bb;font-size:12px}.plainstate .symbol{color:#8e9398}.plainstate.owner{color:#c4d5cc}.statebtn{border:0;background:transparent;border-radius:5px;padding:5px 7px;margin-left:-7px}.statebtn:hover{background:#333639}.statebtn:focus-visible,.group-toggle:focus-visible,.primary:focus-visible{outline:2px solid #80b8e2;outline-offset:2px}.check{width:15px;height:15px;accent-color:#61a7d8}.group-row td{background:#191a1c;color:#bcbec0;font-size:12px;height:32px}.group-row td:hover{background:#191a1c}.group-name{display:flex;align-items:center;gap:8px}.group-count{font-size:11px;color:#85898e}.menu{position:fixed;z-index:10;min-width:185px;background:#292b2e;border:1px solid #424549;box-shadow:0 12px 35px #0008;border-radius:9px;padding:6px;display:none}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:#e0e1e2;font-size:12px;padding:9px;border-radius:5px}.menu button:hover{background:#3a3d40}.note{margin-top:22px;color:#7e8388;font-size:12px;line-height:1.8}.collapsed .reqcol{display:none}.collapsed .reqgroup{opacity:.8}@media(max-width:850px){.sidebar{width:62px}.sidebar .brand{font-size:12px;margin:0 0 24px}.sidebar .nav,.sidebar .nav-label{font-size:0}.sidebar .nav:before{content:'◈';font-size:18px}.main{padding:16px}.hero{margin-top:45px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">▣ BIU · 我的工作区</div><div class="nav">⌕　搜索</div><div class="nav">♧　通知</div><div class="nav">⚙　设置</div><div class="nav">✧　代理</div><div class="nav active">▤　数据</div><div class="nav-label">收藏</div><div class="nav">▦　需求</div><div class="nav-label">用户数据</div><div class="nav">◉　任务</div><div class="nav">▤　页面</div><div class="nav">✣　插件</div><div class="nav">⌁　MCP</div><div class="nav-label">系统数据</div><div class="nav">▦　成员</div><div class="nav">◉　视图</div></aside><main class="main"><div class="crumb">▣　页面　 /　 ▦ 全部页面</div><section class="hero"><div class="docicon">▰</div><h1>全部页面</h1></section><div class="toolbar"><button class="view">▦　全部页面　⌄</button><div class="tools"><button class="iconbtn" title="搜索" onclick="document.getElementById('search').hidden=!document.getElementById('search').hidden">⌕</button><input hidden id="search" placeholder="搜索标题…" oninput="filterRows(this.value)" style="width:140px;background:#292b2e;border:1px solid #414448;color:white;padding:6px;border-radius:6px"><button class="iconbtn" title="筛选">☷</button><button class="iconbtn" title="排序">↕</button><button class="iconbtn" title="刷新" onclick="location.reload()">↻</button><button class="primary" onclick="addRow()">＋ 新建</button></div></div><div class="tablewrap"><table id="db"><colgroup><col style="width:34%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col class="reqcol" style="width:13%"><col class="reqcol" style="width:10%"><col class="reqcol" style="width:13%"></colgroup><thead><tr class="groups"><th colspan="4">基础信息</th><th class="reqgroup" colspan="3"><button class="group-toggle" id="toggle" onclick="toggleGroup()">▾　需求管理　·　3 个字段</button></th></tr><tr class="fields"><th><span class="fieldicon">☰</span>标题</th><th><span class="fieldicon">◇</span>标签</th><th><span class="fieldicon">♧</span>分享范围</th><th><span class="fieldicon">◇</span>我的权限</th><th class="req reqcol"><span class="fieldicon">▤</span>类别</th><th class="req reqcol"><span class="fieldicon">☑</span>完成</th><th class="req reqcol"><span class="fieldicon">⚑</span>优先级</th></tr></thead><tbody id="rows"><tr class="group-row"><td colspan="7"><span class="group-name">⌄　♙ 私人 <span class="group-count">131 条记录</span></span></td></tr></tbody></table></div><p class="note">交互演示：点击「需求管理」可折叠字段组；点击「私人 / 管理」可切换状态；勾选完成状态；搜索标题或新建记录。这里展示的是设计提案，并非 BIU 现有代码实现。</p></main></div><div id="menu" class="menu"></div><script>
const data=[['SANDBOX','需求','私人','管理','',false,''],['✨ 需求：小人工工作时在本轮输入栏上方中间展示实时统计，结束即消失','需求','私人','管理','交互/布局',true,'P2 中'],['自动化：对齐 Notion','需求','私人','管理','',false,''],['任务：对齐 linear','需求','私人','管理','',false,''],['会话：对齐飞书','需求','私人','管理','',false,''],['第四章 地貌','高中地理','私人','管理','',false,''],['🧩 组合：为 AI 提供精准的上下文','BIU 博客','私人','管理','',false,''],['🌱 衍生：在别人的软件之上，叠加你的能力','BIU 博客','私人','管理','',false,''],['第一章 宇宙中的地球','高中地理','私人','管理','',false,''],['sandbox','需求','私人','管理','',false,''],['CHIP浮窗','','私人','管理','',false,''],['sandbox2','测试','私人','管理','',false,'']];let collapsed=false;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tag(t){if(!t)return '';let color=t==='需求'?'green':t==='高中地理'?'orange':t==='测试'?'purple':'';return `<span class="pill ${color}">${esc(t)}</span>`}function render(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('rows').innerHTML=`<tr class="group-row"><td colspan="${collapsed?4:7}"><span class="group-name">⌄　♙ 私人 <span class="group-count">${q?data.filter(x=>x[0].toLowerCase().includes(q)).length+' 条匹配':'131 条记录'}</span></span></td></tr>`+data.map((r,i)=>!r[0].toLowerCase().includes(q)?'':`<tr><td class="titlecell"><span class="file">▰</span>${esc(r[0])}</td><td>${tag(r[1])}</td><td><button class="statebtn" onclick="openMenu(event,${i},2)"><span class="plainstate"><span class="symbol">${r[2]==='私人'?'♙':'◈'}</span>${esc(r[2])} <span class="muted">⌄</span></span></button></td><td><button class="statebtn" onclick="openMenu(event,${i},3)"><span class="plainstate owner"><span class="symbol">◇</span>${esc(r[3])} <span class="muted">⌄</span></span></button></td><td class="reqcol">${r[4]?`<span class="pill blue">${esc(r[4])}</span>`:''}</td><td class="reqcol"><input class="check" aria-label="完成状态" type="checkbox" ${r[5]?'checked':''} onchange="data[${i}][5]=this.checked"></td><td class="reqcol">${r[6]?`<span class="pill orange">${esc(r[6])}</span>`:''}</td></tr>`).join('');document.getElementById('db').classList.toggle('collapsed',collapsed)}function toggleGroup(){collapsed=!collapsed;document.querySelector('.reqgroup').colSpan=collapsed?1:3;document.querySelector('.reqgroup').style.display=collapsed?'table-cell':'';document.getElementById('toggle').textContent=(collapsed?'▸':'▾')+'　需求管理　·　3 个字段';document.querySelectorAll('.reqcol').forEach(el=>el.style.display=collapsed?'none':'');render()}function filterRows(){render()}function addRow(){const name=prompt('新页面标题');if(name?.trim()){data.unshift([name.trim(),'','私人','管理','',false,'']);render()}}function openMenu(e,i,col){e.stopPropagation();const menu=document.getElementById('menu');const choices=col===2?['私人','工作区','指定成员','公开']:['所有者','管理','编辑','评论','查看'];menu.innerHTML=choices.map(x=>`<button data-choice="${x}">${x}</button>`).join('');const rect=e.currentTarget.getBoundingClientRect();menu.style.left=Math.min(rect.left,innerWidth-200)+'px';menu.style.top=Math.min(rect.bottom+4,innerHeight-210)+'px';menu.classList.add('open');menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{data[i][col]=b.dataset.choice;menu.classList.remove('open');render()})}document.addEventListener('click',()=>document.getElementById('menu').classList.remove('open'));render();</script></body></html>
